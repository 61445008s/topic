<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>論文研究主題探索助手｜互動式提問</title>
<style>
:root{--green:#16a34a;--dark:#0284c7;--ink:#213547;--muted:#52677a;--line:#e2e8f0;--mint:#dcfce7;--orange:#fb7185;--sky:#bae6fd;--paper:#fff;--red:#b42346;--pink:#f9a8d4;--lavender:#c4b5fd}
*{box-sizing:border-box}input,select,textarea{max-width:100%}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:'Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;background:radial-gradient(circle at 12% 12%,#bae6fdbb,transparent 28%),radial-gradient(circle at 86% 8%,#f9a8d47a,transparent 30%),radial-gradient(circle at 50% 92%,#86efac80,transparent 30%),linear-gradient(135deg,#fffaf0,#f0f9ff 46%,#fdf2f8);min-height:100vh}.wrap{width:min(1050px,calc(100% - 30px));margin:auto;padding:20px 0 50px}.topbar{background:#ffffffc7;border:1px solid #ffffffdf;border-radius:25px;padding:13px 19px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 10px 25px #24634416}.brand{display:flex;gap:12px;align-items:center;font-weight:900}.logo{background:linear-gradient(135deg,var(--dark),var(--green));color:white;border-radius:15px;padding:12px;font-size:23px}.chip{border-radius:99px;background:var(--mint);padding:8px 13px;color:var(--dark);font-size:13px;font-weight:800}.hero{padding:39px clamp(22px,5vw,48px);margin:22px 0;border-radius:34px;background:linear-gradient(135deg,#fffffff0,#ffffffa8),linear-gradient(135deg,#bae6fd,#f9a8d4,#86efac);box-shadow:0 18px 40px #21354720;border:1px solid #ffffffdf;position:relative;overflow:hidden}.hero:after{content:'📖';position:absolute;right:6%;top:14%;font-size:clamp(50px,11vw,110px);opacity:.28;pointer-events:none}h1{font-size:clamp(28px,4.7vw,49px);margin:0 0 12px;line-height:1.28;position:relative}h1 span{color:var(--green)}.hero p{line-height:1.85;color:var(--muted);max-width:680px;margin:0;position:relative}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.panel{background:#ffffffde;border:1px solid #ffffffdf;border-radius:28px;padding:23px;box-shadow:0 12px 28px #21354714}.sidebar h2,.panel h2{font-size:20px;margin:0 0 14px}.step-nav{display:grid;gap:8px}.step-pill{display:flex;align-items:center;text-align:left;gap:10px;border:0;background:#f8fafc;border-radius:16px;padding:12px 10px;font-weight:800;color:var(--muted);cursor:pointer;font-size:14px}.step-pill .number{width:30px;height:30px;border-radius:11px;background:#e5f3e8;color:var(--green);display:grid;place-items:center;flex-shrink:0}.step-pill.current{background:linear-gradient(135deg,var(--dark),var(--green));color:white}.step-pill.current .number{background:#ffffff33;color:white}.step-pill:disabled{cursor:not-allowed;opacity:.54}.progress-bg{height:12px;border-radius:20px;background:#dcece1;overflow:hidden;margin:15px 0 6px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--sky),var(--orange));transition:width .3s}.small{color:var(--muted);font-size:13px;line-height:1.7}.question-title{margin:7px 0 12px;font-size:clamp(22px,3.4vw,29px)}.question-desc{color:var(--muted);line-height:1.8;margin:0 0 20px}.field{margin:19px 0}.field label{display:block;font-weight:850;margin-bottom:9px}.field input,.field textarea,.field select{display:block;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:inherit;outline:none}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #216b451c}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;align-items:center;gap:9px;cursor:pointer;border:2px solid var(--line);padding:12px;border-radius:15px;background:#fff;font-weight:750}.option:has(input:checked){background:var(--mint);border-color:var(--green)}.option input{accent-color:var(--green);width:18px;height:18px;flex-shrink:0}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.btn{border:0;border-radius:99px;padding:12px 19px;background:linear-gradient(135deg,var(--green),var(--dark));color:white;font:inherit;font-weight:900;cursor:pointer}.btn.secondary{background:#e0f2fe;color:var(--dark)}.btn.accent{background:linear-gradient(135deg,#db2777,#fb7185)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(1.07)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #57b9d8;outline-offset:2px}.error{color:var(--red);font-weight:800;min-height:22px;margin-top:8px}.result{border-radius:22px;padding:20px;border:1px solid var(--line);background:#f8fafc;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.hint{border-left:5px solid var(--sky);background:#e0f2fe;padding:13px 16px;border-radius:13px;color:#245b62;line-height:1.75;font-size:14px;margin-top:20px}.foot{text-align:center;color:var(--muted);font-size:13px;margin:25px 0}.hidden{display:none!important}.result-item{background:white;border:1px solid var(--line);padding:15px;border-radius:17px;margin:11px 0}.result-item b{color:var(--dark)}.result-item p{margin:6px 0;overflow-wrap:anywhere}.wide{grid-column:1/-1}@media(max-width:760px){.layout{grid-template-columns:1fr}.step-nav{grid-template-columns:repeat(3,minmax(0,1fr))}.step-pill{font-size:12px;padding:9px 7px;gap:5px;flex-direction:column}.hero{padding:26px 22px}.topbar{flex-wrap:wrap}.sidebar{padding:16px}}@media(max-width:470px){.wrap{width:calc(100% - 16px)}.panel{padding:16px;border-radius:22px}.options{grid-template-columns:1fr}.step-nav{grid-template-columns:repeat(3,1fr)}.buttons .btn{flex:1 1 100%}.hero:after{opacity:.11}.chip{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="wrap"><header class="topbar"><div class="brand"><div class="logo">📚</div><div>論文研究主題探索助手<br><span class="small">把模糊的想法，變成可研究的問題</span></div></div><span class="chip">🌸 離線使用・資料不外傳</span></header>
<section class="hero"><h1>從一個好奇開始，<br><span>找到你的論文題目！</span></h1><p>循序回答 6 組問題，釐清你的研究興趣、研究缺口、研究對象、方法與可行性，產出研究題目候選、研究問題及初步計畫。這是構想工具，不取代文獻查證與指導教授審核。</p></section>
<div class="layout"><aside class="panel sidebar"><h2>🧭 探索地圖</h2><nav class="step-nav" id="nav" aria-label="問卷步驟"></nav><div class="progress-bg" role="progressbar" aria-label="填答進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress" ><div class="progress-fill" id="fill"></div></div><div id="pct" class="small">第 1 / 6 步</div><div class="hint">💡 不需要一次想出完美題目。先說明你想解決的問題，再逐步縮小範圍。</div></aside>
<section class="panel" id="content" aria-live="polite"><div class="small" id="stepLabel"></div><h2 class="question-title" id="heading"></h2><p class="question-desc" id="description"></p><form id="survey" novalidate><div id="fields"></div><div class="error" id="error" role="alert"></div><div class="buttons"><button class="btn secondary" id="prev" type="button">← 上一步</button><button class="btn" id="next" type="submit">下一步 →</button><button class="btn secondary" id="reset" type="button">清除重來</button></div></form><div id="results" class="hidden"></div></section></div>
<footer class="foot">🌸 研究題目探索工具｜內容僅保留於此頁面記憶體中，關閉頁面即不再保留。</footer></main>
<script>
'use strict';
// 問卷資料只儲存在本頁記憶體，不會送往伺服器。
const steps=[
{title:'找到你的研究興趣',desc:'先從你真正感興趣、願意長時間探索的領域出發。',fields:[{id:'discipline',label:'你的學術領域或系所是？',type:'text',placeholder:'例如：教育科技、護理、公共行政、資訊管理',required:true},{id:'interest',label:'你最想研究的現象或主題？',type:'textarea',placeholder:'例如：生成式 AI 如何影響國小教師備課？',required:true},{id:'motivation',label:'你為什麼對這件事感興趣？',type:'textarea',placeholder:'例如：實習觀察、工作經驗、個人好奇…'}]},
{title:'聚焦真實問題',desc:'好題目不只是領域名稱，更要說清楚「什麼問題值得被研究」。',fields:[{id:'problem',label:'你觀察到的具體問題或矛盾是什麼？',type:'textarea',placeholder:'例如：教師經常使用 AI，但對產出內容的可信度沒有一致做法。',required:true},{id:'importance',label:'如果理解這個問題，可能對誰有幫助？',type:'textarea',placeholder:'例如：教師、學校、政策制定者…',required:true},{id:'gap',label:'你懷疑目前還有哪些不清楚的地方？（待文獻查證）',type:'textarea',placeholder:'例如：不同教學年資教師的使用經驗是否不同？'}]},
{title:'界定研究範圍',desc:'把研究縮小到你能接觸、觀察及分析的對象。',fields:[{id:'population',label:'你想研究誰或什麼？',type:'text',placeholder:'例如：臺北市公立國小教師',required:true},{id:'context',label:'研究場域、地區或情境？',type:'text',placeholder:'例如：2026 學年度的國小教學現場'},{id:'focus',label:'你最想比較或理解的因素／概念是？',type:'text',placeholder:'例如：使用頻率、信任程度、備課效率',required:true}]},
{title:'選擇研究策略',desc:'依照你想回答的問題，選擇一個可行的起點；正式設計仍需與指導教授討論。',fields:[{id:'method',label:'你傾向哪種研究方法？',type:'radio',required:true,options:['質性研究（訪談／觀察）','量化研究（問卷／統計）','混合方法（質性＋量化）','設計與開發／行動研究','尚未決定']},{id:'data',label:'你預計如何蒐集資料？',type:'checkbox',options:['訪談','問卷','觀察','文件或文本分析','公開資料','實驗或介入','尚未決定']},{id:'access',label:'你有哪些可以取得的資料或資源？',type:'textarea',placeholder:'例如：可邀請教師訪談，或可使用公開資料集。'}]},
{title:'檢查研究可行性',desc:'論文題目需要兼顧價值、時間、資料取得及研究倫理。',fields:[{id:'time',label:'預計有多少時間完成？',type:'select',options:['','3 個月內','3–6 個月','6–12 個月','超過 12 個月'],required:true},{id:'obstacle',label:'目前最擔心的困難？',type:'checkbox',options:['招募受試者','取得資料','研究方法不熟悉','時間有限','研究倫理或隱私','文獻不足或不確定','尚無明顯困難']},{id:'boundary',label:'有哪些限制或不能做的事？',type:'textarea',placeholder:'例如：無法取得學生個資、無法做長期追蹤。'}]},
{title:'形成論文主張',desc:'為論文設定方向，系統會依你填入的內容整理候選題目及提問。',fields:[{id:'goal',label:'你最希望論文最後回答什麼？',type:'textarea',placeholder:'例如：理解教師如何判斷 AI 內容可信度，以及影響因素。',required:true},{id:'contribution',label:'你期待帶來什麼貢獻？',type:'textarea',placeholder:'例如：提出教師實務建議或設計原則。'},{id:'keywords',label:'請列出 3–5 個關鍵字（以逗號分隔）',type:'text',placeholder:'例如：生成式AI、教師、備課、信任、國小'}]}
];
const values={};let current=0;const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getValue(f){return values[f.id]??(f.type==='checkbox'?[]:'')}
function render(){const step=steps[current];$('results').classList.add('hidden');$('survey').classList.remove('hidden');$('stepLabel').textContent=`第 ${current+1} 步 / 共 ${steps.length} 步`;$('heading').textContent=step.title;$('description').textContent=step.desc;$('error').textContent='';$('fields').innerHTML='';step.fields.forEach(f=>{const box=document.createElement('div');box.className='field';const lbl=document.createElement('label');lbl.textContent=f.label+(f.required?' *':'');box.appendChild(lbl);if(f.type==='radio'||f.type==='checkbox'){const options=document.createElement('div');options.className='options';f.options.forEach((opt,i)=>{const row=document.createElement('label');row.className='option';const input=document.createElement('input');input.type=f.type;input.name=f.id;input.value=opt;input.checked=f.type==='checkbox'?getValue(f).includes(opt):getValue(f)===opt;if(i===0)lbl.htmlFor=f.id+'-0';input.id=f.id+'-'+i;const text=document.createElement('span');text.textContent=opt;row.append(input,text);options.appendChild(row)});box.appendChild(options)}else{const el=document.createElement(f.type==='textarea'?'textarea':f.type==='select'?'select':'input');el.id=f.id;el.name=f.id;if(f.type==='text')el.type='text';if(f.placeholder)el.placeholder=f.placeholder;if(f.type==='select')f.options.forEach(op=>{const item=document.createElement('option');item.value=op;item.textContent=op||'請選擇';el.appendChild(item)});el.value=getValue(f);lbl.htmlFor=f.id;box.appendChild(el)}$('fields').appendChild(box)});$('prev').disabled=current===0;$('next').textContent=current===steps.length-1?'✨ 產生研究題目':'下一步 →';$('nav').innerHTML='';steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='step-pill'+(i===current?' current':'');b.disabled=i>current;b.innerHTML=`<span class="number">${i+1}</span><span>${escapeHTML(s.title)}</span>`;b.onclick=()=>{saveCurrent();current=i;render()};$('nav').appendChild(b)});const pct=Math.round(current/steps.length*100);$('fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('pct').textContent=`第 ${current+1} / ${steps.length} 步 · 已完成 ${pct}%`}
function saveCurrent(){steps[current].fields.forEach(f=>{if(f.type==='checkbox')values[f.id]=Array.from(document.querySelectorAll(`input[name="${f.id}"]:checked`)).map(el=>el.value);else if(f.type==='radio')values[f.id]=document.querySelector(`input[name="${f.id}"]:checked`)?.value||'';else values[f.id]=$(f.id)?.value.trim()||''})}
function check(){const missing=steps[current].fields.find(f=>f.required&&(!values[f.id]||(Array.isArray(values[f.id])&&!values[f.id].length)));if(missing){$('error').textContent='請先填寫「'+missing.label+'」。';const control=$(missing.id)||document.querySelector(`[name="${missing.id}"]`);control?.focus();return false}return true}
$('survey').addEventListener('submit',e=>{e.preventDefault();saveCurrent();if(!check())return;if(current<steps.length-1){current++;render()}else showResult()});$('prev').onclick=()=>{saveCurrent();if(current>0){current--;render()}};
$('reset').onclick=()=>{if(!confirm('確定要清除目前所有填答並重新開始嗎？'))return;Object.keys(values).forEach(k=>delete values[k]);current=0;render()};
function pick(s,fallback){const v=values[s];return typeof v==='string'&&v.trim()?v.trim():fallback}
function makeDraft(){const topic=pick('interest','［感興趣的議題］'),people=pick('population','［研究對象］'),factor=pick('focus','［關鍵概念］'),place=pick('context','特定研究情境'),method=pick('method','尚未決定');const titles=[`${people}之${topic}：以${factor}為探討焦點`,`${place}中${people}對${factor}的經驗與看法：以${topic}為例`,`${factor}與${topic}之關聯探討：以${people}為對象`];const qs=[`在${place}中，${people}如何經驗或理解「${topic}」？`,`「${factor}」在${topic}中扮演什麼角色？`,`哪些條件或因素影響${people}在上述議題中的經驗或表現？`];const notes=[`研究問題：${pick('problem','尚待釐清')}`,`研究價值：${pick('importance','尚待補充')}`,`可能研究缺口（需文獻確認）：${pick('gap','尚待查證')}`,`研究目標：${pick('goal','尚待補充')}`,`預期貢獻：${pick('contribution','尚待補充')}`,`研究對象：${people}`,`研究範圍：${place}`,`核心概念：${factor}`,`方法傾向：${method}`,`資料蒐集：${(values.data||[]).join('、')||'尚未決定'}`,`資料資源：${pick('access','尚待確認')}`,`預計期間：${pick('time','尚未決定')}`,`可能困難：${(values.obstacle||[]).join('、')||'尚未提出'}`,`研究限制：${pick('boundary','尚待補充')}`,`關鍵字：${pick('keywords','尚待補充')}`];return {titles,qs,notes,method}}
function buildText(d){return ['論文研究主題探索紀錄','','一、候選研究題目',...d.titles.map((s,i)=>`${i+1}. ${s}`),'','二、初步研究問題',...d.qs.map((s,i)=>`${i+1}. ${s}`),'','三、研究規劃摘要',...d.notes,'','四、下一步建議','1. 檢索近五年核心文獻，確認真正的研究缺口。','2. 與指導教授確認題目範圍、研究設計與倫理需求。','3. 評估可取得的研究樣本與資料，修訂研究問題。','','提醒：上述標題與問題是依填答內容自動組合的草案，須人工潤飾與文獻驗證。'].join('\n')}
function showResult(){const d=makeDraft();$('survey').classList.add('hidden');$('results').classList.remove('hidden');$('stepLabel').textContent='探索完成';$('heading').textContent='🎉 你的研究題目初稿';$('description').textContent='以下是自動整理的候選題目及研究問題。可修改填答、複製或下載文字紀錄。';$('results').replaceChildren();const h=document.createElement('h3');h.textContent='📌 候選論文題目';$('results').appendChild(h);d.titles.forEach((t,i)=>{const item=document.createElement('div');item.className='result-item';item.textContent=`${i+1}. ${t}`;$('results').appendChild(item)});const q=document.createElement('h3');q.textContent='🔎 初步研究問題';$('results').appendChild(q);d.qs.forEach((t,i)=>{const item=document.createElement('div');item.className='result-item';item.textContent=`${i+1}. ${t}`;$('results').appendChild(item)});const heading=document.createElement('h3');heading.textContent='📝 研究規劃摘要';$('results').appendChild(heading);const summary=document.createElement('div');summary.className='result';summary.textContent=d.notes.join('\n');$('results').appendChild(summary);const hint=document.createElement('div');hint.className='hint';hint.textContent='⚠️ 這些題目是依據輸入內容組合的構想，並非已驗證的研究缺口。請先查閱文獻、評估倫理和資料可得性，再與指導教授確認。';$('results').appendChild(hint);const btns=document.createElement('div');btns.className='buttons';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='← 返回修改';edit.onclick=()=>render();const copy=document.createElement('button');copy.className='btn';copy.textContent='📋 複製完整內容';copy.onclick=async()=>{try{await navigator.clipboard.writeText(buildText(d));copy.textContent='✅ 已複製'}catch{const ta=document.createElement('textarea');ta.value=buildText(d);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');copy.textContent='✅ 已複製'}catch{copy.textContent='請改用下載文字檔'}ta.remove()}};const download=document.createElement('button');download.className='btn accent';download.textContent='⬇️ 下載 TXT';download.onclick=()=>{const blob=new Blob(['\ufeff',buildText(d)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='thesis_topic_draft.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};btns.append(edit,copy,download);$('results').appendChild(btns);$('fill').style.width='100%';$('pct').textContent='6 / 6 步 · 已完成 100%';$('progress').setAttribute('aria-valuenow','100');$('results').scrollIntoView({behavior:'smooth',block:'nearest'})}
render();
</script>
</body></html>
